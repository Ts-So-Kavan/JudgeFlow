<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JudgeFlow Companion</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <span class="eyebrow">JUDGEFLOW COMPANION</span>
      <h1>Tabroom handoff</h1>
      <p id="status">Checking for a ballot…</p>
      <div id="summary" hidden></div>
      <button id="open" type="button">Open Tabroom</button>
      <button id="clear" class="secondary" type="button" hidden>Clear saved ballot</button>
      <small>The companion fills fields only. You review and submit the ballot yourself.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
